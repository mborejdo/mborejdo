# Renders cloud.toml as static SVG and PNG clouds once a day with a fresh seed, so the layout
# reshuffles, and on every change to the word list (or by hand).
# The render replaces the single commit on the orphan `cloud` branch (force-push), so the
# history never grows; the README links there.
# Public data only: the word list plus recent public GitHub languages/topics.
name: wordcloud

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
  push:
    paths: [cloud.toml]

permissions:
  contents: write

concurrency:
  group: wordcloud
  cancel-in-progress: false

jobs:
  cloud:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: mborejdo/wordcloud@v3
        with:
          wordlist: cloud.toml
          out: cloud.svg
          png: "2"
          seed: ${{ github.run_number }}
          github-user: ${{ github.repository_owner }}

      - name: Publish to the cloud branch
        run: |
          git switch --orphan cloud
          git add -f cloud.svg cloud-dark.svg cloud.png cloud-dark.png
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Word cloud"
          git push --force origin cloud
