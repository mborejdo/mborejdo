# Renders cloud.toml on every change to the word list (or by hand): the static clouds and the
# animated ones that build up word by word. Public data only: the word list plus recent public
# GitHub languages/topics. No daily run: every render commits two GIFs of a few MB.
name: wordcloud

on:
  workflow_dispatch:
  push:
    paths: [cloud.toml]

permissions:
  contents: write

concurrency:
  group: wordcloud
  cancel-in-progress: false

jobs:
  cloud:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: mborejdo/wordcloud@v3
        with:
          wordlist: cloud.toml
          out: cloud.svg
          png: "2"
          gif: "true"
          once: "true"
          delay: "1"
          seed: ${{ github.run_number }}
          github-user: ${{ github.repository_owner }}

      - name: Commit if changed
        run: |
          git add cloud.svg cloud-dark.svg cloud.png cloud-dark.png cloud.gif cloud-dark.gif
          if git diff --cached --quiet; then
            echo "cloud unchanged - nothing to commit"
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Update word cloud"
          git push
