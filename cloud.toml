words = [
  { text = "ADRs", related = ["ADR", "architecture decision records"] }, "Observability", "Release Gates",
  "DevOps", "APIs", { text = "Kubernetes", related = ["k8s", "kubectl", "Helm"] }, "GitOps", "MCP", "OAuth 2.1",
  "GxP", "B2B Commerce",
]

[[tier]]
