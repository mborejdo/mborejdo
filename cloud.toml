# Word cloud for github.com/mborejdo.
# Public on purpose: skills and tech only. No client, employer, repo or internal names.
#
#   One tier = one base weight (10 = biggest). Order inside a tier does not matter, the seed shuffles it.
#   A tier word is "Text" or { text = "Text", related = ["alias", ...] }.
#   `terms` fold into the word they belong to (+term-boost each); `--github <user>` adds a small
#   boost from recent public languages/topics, but only to words listed here.
#   Order to keep: Software Architecture > System Design > TypeScript, Rust; Kubernetes is one tool among many (check with `wordcloud cloud.toml --explain`).

# Raw terms that fold into the words above.
# Each one must fold into a word above; `--explain` flags anything that would become a new word.
terms = [
  "Kubernetes", "ArgoCD", "Docker", "Container", "Nomad", "Terraform", "CI/CD", "Pipelines",
  "DevOps", "Linux", "unix", "PostgreSQL", "SQL", "OpenAPI", "REST", "API", "Testing", "TDD",
  "E2E", "Playwright", "Documentation", "Azure", "GxP", "ecommerce", "MSD", "architecture", "AI",
  "ADR", "integration", "observability", "OAuth", "OIDC", "platform", "release gate", "tracing", "SAP", "supply-chain", "reproducible",
]

[style]
width = 1600
height = 600
seed = 160
shape = "rect"
fill = true
vertical = 0.18   # share of words set vertically (never the top tier)
gap = 2.0         # min distance between words, canvas px (plus 8% of the font size)
contrast = 1.5    # size = scale * (weight / 10) ^ contrast

[semantic]
backend = "offline"   # or "embed": OpenAI-compatible endpoint, sends the word list only
term-boost = 0.35
term-cap = 1.0
mention-boost = 0.15
mention-cap = 6
new-weight = 3.0      # raw terms that match nothing become words of this weight
new-colour = "soft"
# endpoint = "http://localhost:11434/v1/embeddings"
# model = "nomic-embed-text"
# threshold = 0.8
# Live boost with `--github <user>`: languages and topics of the most recently pushed public
# repos. They only boost words above - anything that does not fold into a curated word is ignored.
github-boost = 0.1    # per recent repo
github-cap = 0.5

[colours]
accent = "#1d6fb8"
sky = "#3f86c6"
ink = "#1d2129"
slate = "#3a4150"
muted = "#606a7e"
mist = "#7d8596"
soft = "#a0a7b4"

# Same names, for cloud-dark.svg - same layout, only the colours differ.
# One step per tier, from accent down to soft; dark runs the same ramp from bright to dim.
# The blues and greys are the shared tokens (accent, ink, muted), same as the film below.
[colours-dark]
accent = "#7cc4fa"
sky = "#5aa9e6"
ink = "#e8e6e3"
slate = "#c6c9d1"
muted = "#8b93a7"
mist = "#6f7789"
soft = "#575e6e"

[[tier]]
weight = 10
colour = "accent"
words = [{ text = "Software Architecture", related = ["architecture", "architect"] }]

[[tier]]
weight = 9.5
colour = "accent"
words = ["System Design", "Platform Engineering"]

[[tier]]
weight = 9
colour = "sky"
words = [{ text = "Enterprise Integration", related = ["integration", "integration architecture", "Systems Integration"] }, "API Design"]

[[tier]]
weight = 8
colour = "ink"
words = [
  { text = "TypeScript", related = ["tsc", "typed language", "TS"] }, { text = "Rust", related = ["cargo"] },
  "AI Agents", { text = "SDK Design", related = ["SDK", "SDKs", "crates"] },
]

