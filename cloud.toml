# Word cloud for github.com/mborejdo.
# Public on purpose: skills and tech only. No client, employer, repo or internal names.
#
#   One tier = one base weight (10 = biggest). Order inside a tier does not matter, the seed shuffles it.
#   A tier word is "Text" or { text = "Text", related = ["alias", ...] }.
#   `terms` fold into the word they belong to (+term_boost each); `--github <user>` adds a small
#   boost from recent public languages/topics, but only to words listed here.
#   Order to keep: TypeScript > Rust > Architecture; Kubernetes is one tool among many (check with `wordcloud cloud.toml --explain`).

# Raw terms that fold into the words above.
# Each one must fold into a word above; `--explain` flags anything that would become a new word.
terms = [
  "TypeScript", "tsc", "JavaScript", "JS", "NextJS", "ReactNative", "VueJS", "Webcomponents",
  "Tailwind", "nodejs", "PHP", "Symfony", "Composer", "PHPUnit", "Rust", "Kubernetes",
  "ArgoCD", "Docker", "Container", "Terraform", "CI/CD", "Pipelines", "DevOps", "Linux", "unix",
  "PostgreSQL", "SQL", "OpenAPI", "REST", "API", "Azure", "MSD", "architecture", "AI",
]

[style]
width = 1600
height = 600
seed = 160
shape = "rect"
fill = true
vertical = 0.18   # share of words set vertically (never the top tier)
gap = 2.0         # min distance between words, canvas px (plus 8% of the font size)
contrast = 1.5    # size = scale * (weight / 10) ^ contrast

[semantic]
backend = "offline"   # or "embed": OpenAI-compatible endpoint, sends the word list only
term_boost = 0.35
term_cap = 1.0
mention_boost = 0.15
mention_cap = 6
new_weight = 3.0      # raw terms that match nothing become words of this weight
new_color = "soft"
# endpoint = "http://localhost:11434/v1/embeddings"
# model = "nomic-embed-text"
# threshold = 0.8
# Live boost with `--github <user>`: languages and topics of the most recently pushed public
# repos. They only boost words above - anything that does not fold into a curated word is ignored.
github_boost = 0.1    # per recent repo
github_cap = 0.5

[colors]
accent = "#5b4fb3"
ink = "#111318"
muted = "#5c6370"
soft = "#9aa0a8"

# Same names, for cloud-dark.svg - same layout, only the colours differ.
# Contrast on GitHub dark (#0d1117): accent 6.8:1, ink 15.3:1, muted 7.2:1, soft 5.1:1.
[colors_dark]
accent = "#9d8fe8"
ink = "#e6e7ea"
muted = "#9aa0a8"
soft = "#7d8590"

[[tier]]
weight = 10
color = "accent"
words = [{ text = "TypeScript", related = ["tsc", "typed language", "TS"] }]

[[tier]]
weight = 9.5
color = "accent"
words = [{ text = "Rust", related = ["cargo"] }]

[[tier]]
weight = 9
color = "accent"
words = [{ text = "Architecture", related = ["software architecture", "architect"] }]

[[tier]]
weight = 8
color = "ink"
words = ["DevOps", "System Design", "APIs", "Next.js", "React", "Platform Engineering"]

[[tier]]
weight = 7
color = "ink"
words = ["MCP", "AI Agents", "Fullstack", "OAuth 2.1", "Docker", { text = "Kubernetes", related = ["k8s", "kubectl", "Helm"] }, "GitOps"]

[[tier]]
weight = 6
color = "ink"
words = [
  "JavaScript", "Node.js", "PostgreSQL", "Nomad", "Terraform", "Azure", "OpenAPI",
  "Infrastructure as Code", "React Native", "CLI", "GitHub Actions", "PHP",
]

[[tier]]
weight = 5
color = "muted"
words = [
  "Axum", "Tokio", "OIDC", "SQL", "Linux", "Redis", "Vue", "Lit", "Web Components",
  "Tailwind", "Agent Workflows", "RAG", "Python",
]

[[tier]]
weight = 3
color = "soft"
words = ["Media System Design", "Flash", "ActionScript"]
